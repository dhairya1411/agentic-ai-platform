[project]
name = "agentic-ai-worker"
version = "0.1.0"
description = "Asynchronous worker service for the AI Project Manager platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["setuptools>=75.6,<76.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["mypy>=1.14.0,<2.0.0", "pytest>=8.3.4,<9.0.0", "ruff>=0.8.4,<0.9.0"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
python_version = "3.12"
strict = true
