[project]
name = "agentic-ai-api"
version = "0.1.0"
description = "API service for the AI Project Manager platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14.0,<2.0.0",
  "asyncpg>=0.30.0,<0.31.0",
  "cryptography>=44.0.0,<45.0.0",
  "fastapi>=0.115.6,<0.116.0",
  "langgraph>=0.4.0,<2.0.0",
  "openai>=1.66.0,<3.0.0",
  "qdrant-client>=1.12.0,<2.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "PyJWT>=2.10.0,<3.0.0",
  "sqlalchemy>=2.0.36,<2.1.0",
  "uvicorn[standard]>=0.34.0,<0.35.0",
]

[build-system]
requires = ["setuptools>=75.6,<76.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["httpx>=0.28.1,<0.29.0", "mypy>=1.14.0,<2.0.0", "pytest>=8.3.4,<9.0.0", "pytest-asyncio>=0.25.0,<0.26.0", "ruff>=0.8.4,<0.9.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
